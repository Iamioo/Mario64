<!doctype html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Super Mario 64</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      touch-action: none;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
    }

    #container {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    canvas {
      width: 100vw;
      height: 100vh;
      display: block;
      image-rendering: pixelated;
      outline: none;
    }

    #mobile-ui {
      position: fixed;
      inset: 0;
      z-index: 99999;
      pointer-events: none;
      touch-action: none;
    }

    .control {
      pointer-events: auto;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }

    #stick-base {
      position: absolute;
      left: max(22px, env(safe-area-inset-left));
      bottom: max(22px, env(safe-area-inset-bottom));
      width: 150px;
      height: 150px;
      border-radius: 50%;
      background: rgba(255,255,255,.12);
      border: 3px solid rgba(255,255,255,.40);
      box-shadow: inset 0 0 28px rgba(0,0,0,.45);
    }

    #stick-knob {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 68px;
      height: 68px;
      margin-left: -34px;
      margin-top: -34px;
      border-radius: 50%;
      background: rgba(255,255,255,.52);
      border: 2px solid rgba(255,255,255,.85);
      box-shadow: 0 4px 14px rgba(0,0,0,.35);
      transform: translate(0px, 0px);
    }

    .btn {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,.65);
      background: rgba(255,255,255,.22);
      color: #fff;
      font-weight: 800;
      text-shadow: 0 2px 4px #000;
      box-shadow: 0 4px 12px rgba(0,0,0,.28);
    }

    .btn.pressed {
      background: rgba(255,255,255,.65);
      transform: scale(.93);
    }

    #btn-a {
      right: max(24px, env(safe-area-inset-right));
      bottom: max(42px, env(safe-area-inset-bottom));
      width: 82px; height: 82px;
      font-size: 32px;
      background: rgba(50, 170, 90, .38);
    }

    #btn-b {
      right: calc(max(24px, env(safe-area-inset-right)) + 86px);
      bottom: calc(max(42px, env(safe-area-inset-bottom)) + 22px);
      width: 72px; height: 72px;
      font-size: 28px;
      background: rgba(55, 110, 220, .38);
    }

    #btn-z {
      left: calc(max(22px, env(safe-area-inset-left)) + 30px);
      bottom: calc(max(22px, env(safe-area-inset-bottom)) + 158px);
      width: 88px; height: 48px;
      border-radius: 22px;
      font-size: 20px;
      background: rgba(120,120,120,.42);
    }

    #btn-start {
      left: 50%;
      bottom: max(18px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      width: 78px; height: 38px;
      border-radius: 18px;
      font-size: 13px;
    }

    #btn-start.pressed {
      transform: translateX(-50%) scale(.93);
    }

    #c-cluster {
      position: absolute;
      right: calc(max(24px, env(safe-area-inset-right)) + 20px);
      bottom: calc(max(42px, env(safe-area-inset-bottom)) + 120px);
      width: 142px;
      height: 142px;
      pointer-events: none;
    }

    .cbtn {
      width: 48px;
      height: 48px;
      font-size: 20px;
      background: rgba(245, 195, 35, .40);
      border-color: rgba(255, 225, 80, .82);
    }

    #c-up    { left:47px; top:0; }
    #c-down  { left:47px; bottom:0; }
    #c-left  { left:0; top:47px; }
    #c-right { right:0; top:47px; }

    #rotate-hint {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100000;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px;
      background: #111;
      font-size: 20px;
      line-height: 1.4;
    }

    @media (orientation: portrait) and (max-width: 900px) {
      #rotate-hint { display: flex; }
    }

    @media (min-width: 1000px) and (pointer: fine) {
      #mobile-ui { display: none; }
    }
  </style>
</head>
<body>
  <div id="container">
    <canvas class="emscripten" id="canvas" tabindex="0"></canvas>
  </div>

  <div id="mobile-ui">
    <div id="stick-base" class="control">
      <div id="stick-knob"></div>
    </div>

    <div id="btn-z" class="btn control">Z</div>
    <div id="btn-start" class="btn control">START</div>

    <div id="c-cluster">
      <div id="c-up" class="btn cbtn control">C▲</div>
      <div id="c-down" class="btn cbtn control">C▼</div>
      <div id="c-left" class="btn cbtn control">C◀</div>
      <div id="c-right" class="btn cbtn control">C▶</div>
    </div>

    <div id="btn-b" class="btn control">B</div>
    <div id="btn-a" class="btn control">A</div>
  </div>

  <div id="rotate-hint">Drehe dein Handy ins Querformat.</div>

  <script>
    var Module = {
      preRun: [],
      postRun: [],
      print: function(text) {
        if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
        console.log(text);
      },
      printErr: function(text) {
        if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
        console.error(text);
      },
      canvas: (function() {
        var canvas = document.getElementById('canvas');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        canvas.addEventListener("webglcontextlost", function(e) {
          alert('WebGL context lost. Reload the page.');
          e.preventDefault();
        }, false);
        return canvas;
      })(),
      setStatus: function() {}
    };
  </script>

  <script async type="text/javascript" src="sm64.us.f3dex2e.js"></script>

  <script>
  (function () {
    const canvas = document.getElementById('canvas');
    const held = new Set();

    const KEYS = {
      ArrowUp:    { key: 'ArrowUp',    code: 'ArrowUp',    keyCode: 38 },
      ArrowDown:  { key: 'ArrowDown',  code: 'ArrowDown',  keyCode: 40 },
      ArrowLeft:  { key: 'ArrowLeft',  code: 'ArrowLeft',  keyCode: 37 },
      ArrowRight: { key: 'ArrowRight', code: 'ArrowRight', keyCode: 39 },

      A:     { key: 'x', code: 'KeyX', keyCode: 88 },
      B:     { key: 'c', code: 'KeyC', keyCode: 67 },
      Z:     { key: ' ', code: 'Space', keyCode: 32 },
      Start: { key: 'Enter', code: 'Enter', keyCode: 13 },

      CUp:    { key: 'w', code: 'KeyW', keyCode: 87 },
      CDown:  { key: 's', code: 'KeyS', keyCode: 83 },

      // Diese beiden sind für Builds gedacht, die A/D als Kamera links/rechts nutzen.
      // Falls dein WASM sie nicht belegt hat, richten sie keinen Schaden an.
      CLeft:  { key: 'a', code: 'KeyA', keyCode: 65 },
      CRight: { key: 'd', code: 'KeyD', keyCode: 68 }
    };

    function makeKeyboardEvent(type, data) {
      const ev = new KeyboardEvent(type, {
        key: data.key,
        code: data.code,
        bubbles: true,
        cancelable: true
      });

      // Safari/iOS und ältere Emscripten/SDL-Builds lesen teilweise keyCode/which.
      try { Object.defineProperty(ev, 'keyCode', { get: () => data.keyCode }); } catch (_) {}
      try { Object.defineProperty(ev, 'which',   { get: () => data.keyCode }); } catch (_) {}
      return ev;
    }

    function send(name, down) {
      const data = KEYS[name];
      if (!data) return;

      if (down) {
        if (held.has(name)) return;
        held.add(name);
      } else {
        if (!held.has(name)) return;
        held.delete(name);
      }

      window.dispatchEvent(makeKeyboardEvent(down ? 'keydown' : 'keyup', data));
    }

    function releaseAll() {
      [...held].forEach(name => send(name, false));
    }

    function bindButton(id, keyName) {
      const el = document.getElementById(id);
      if (!el) return;

      const press = e => {
        e.preventDefault();
        e.stopPropagation();
        canvas.focus({ preventScroll: true });
        try { el.setPointerCapture(e.pointerId); } catch (_) {}
        el.classList.add('pressed');
        send(keyName, true);
      };

      const release = e => {
        e.preventDefault();
        e.stopPropagation();
        el.classList.remove('pressed');
        send(keyName, false);
      };

      el.addEventListener('pointerdown', press, { passive: false });
      el.addEventListener('pointerup', release, { passive: false });
      el.addEventListener('pointercancel', release, { passive: false });
      el.addEventListener('lostpointercapture', release, { passive: false });
      el.addEventListener('contextmenu', e => e.preventDefault());
    }

    bindButton('btn-a', 'A');
    bindButton('btn-b', 'B');
    bindButton('btn-z', 'Z');
    bindButton('btn-start', 'Start');
    bindButton('c-up', 'CUp');
    bindButton('c-down', 'CDown');
    bindButton('c-left', 'CLeft');
    bindButton('c-right', 'CRight');

    const base = document.getElementById('stick-base');
    const knob = document.getElementById('stick-knob');
    let stickPointer = null;
    let stickState = { up:false, down:false, left:false, right:false };

    function setStickKey(name, value) {
      if (stickState[name] === value) return;
      stickState[name] = value;
      const map = {
        up: 'ArrowUp',
        down: 'ArrowDown',
        left: 'ArrowLeft',
        right: 'ArrowRight'
      };
      send(map[name], value);
    }

    function updateStick(clientX, clientY) {
      const r = base.getBoundingClientRect();
      const cx = r.left + r.width / 2;
      const cy = r.top + r.height / 2;
      let dx = clientX - cx;
      let dy = clientY - cy;

      const max = r.width * 0.34;
      const len = Math.hypot(dx, dy);
      if (len > max) {
        dx = dx / len * max;
        dy = dy / len * max;
      }

      knob.style.transform = `translate(${dx}px, ${dy}px)`;

      const nx = dx / max;
      const ny = dy / max;
      const threshold = 0.28;

      setStickKey('left',  nx < -threshold);
      setStickKey('right', nx >  threshold);
      setStickKey('up',    ny < -threshold);
      setStickKey('down',  ny >  threshold);
    }

    function resetStick() {
      knob.style.transform = 'translate(0px, 0px)';
      setStickKey('up', false);
      setStickKey('down', false);
      setStickKey('left', false);
      setStickKey('right', false);
      stickPointer = null;
    }

    base.addEventListener('pointerdown', e => {
      e.preventDefault();
      if (stickPointer !== null) return;
      stickPointer = e.pointerId;
      canvas.focus({ preventScroll: true });
      try { base.setPointerCapture(e.pointerId); } catch (_) {}
      updateStick(e.clientX, e.clientY);
    }, { passive: false });

    base.addEventListener('pointermove', e => {
      if (e.pointerId !== stickPointer) return;
      e.preventDefault();
      updateStick(e.clientX, e.clientY);
    }, { passive: false });

    base.addEventListener('pointerup', e => {
      if (e.pointerId === stickPointer) resetStick();
    }, { passive: false });

    base.addEventListener('pointercancel', e => {
      if (e.pointerId === stickPointer) resetStick();
    }, { passive: false });

    window.addEventListener('blur', releaseAll);
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        resetStick();
        releaseAll();
      }
    });

    window.addEventListener('resize', () => {
      if (Module && Module.canvas) {
        Module.canvas.width = window.innerWidth;
        Module.canvas.height = window.innerHeight;
      }
    });

    // Verhindert Zoomen/Scrollen während des Spielens.
    document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
  })();
  </script>
</body>
</html>
