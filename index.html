<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Super Mario 64 </title>
    <style>
      body, html{
        margin: 0;
        padding: 0;
        width: 100vw;
        min-height: 100vh;
        background-color: #111;
        font-family: Arial, Helvetica, sans-serif;
        color: white;
        image-rendering: pixelated;
        scrollbar-width: none;
      }
      ::-webkit-scrollbar {
        display: none;
      }
      #container {
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      canvas {
        width: 100vw;
        height: 100vh;
      }
      #controls {
        margin-left: 1em;
        display: flex;
        align-items: center;
      }
      #controller, #dmca {
        padding-left: 4em;
      }
    </style>
  </head>
  <body>
    <div id="container">
      <canvas class="emscripten" id="canvas"></canvas>
    </div>
    <script type='text/javascript'>
      var Module = {
        preRun: [],
        postRun: [],
        print: (function() {
          return function(text) {
            if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
            console.log(text);
          };
        })(),
        printErr: function(text) {
          if (arguments.length > 1)
            text = Array.prototype.slice.call(arguments).join(' ');
          console.error(text);
        },
        canvas: (function() {
          var canvas = document.getElementById('canvas');
          canvas.width = window.innerWidth; // Todo: how to do this from c++
          canvas.height = window.innerHeight;
          canvas.addEventListener("webglcontextlost", function(e) {
            alert('WebGL context lost. You will need to reload the page.');
            e.preventDefault();
          }, false);
          return canvas;
        })(),
        setStatus: function(text) {
        }
      };
    </script>
    <script async type="text/javascript" src="sm64.us.f3dex2e.js"></script>
    <script>
    </script>
  </body>
  <!-- Touch Controls Overlay -->
<style>
  .mobile-controls {
    position: fixed;
    bottom: 20px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-between;
    padding: 0 20px;
    z-index: 999999;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  .dpad, .action-btns {
    display: grid;
    gap: 10px;
  }
  .dpad {
    grid-template-columns: repeat(3, 50px);
    grid-template-rows: repeat(3, 50px);
  }
  .action-btns {
    grid-template-columns: repeat(2, 60px);
    grid-template-rows: repeat(2, 60px);
  }
  .touch-btn {
    background: rgba(255, 255, 255, 0.4);
    border: 2px solid #fff;
    border-radius: 50%;
    color: white;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    touch-action: none;
  }
  .touch-btn:active {
    background: rgba(255, 255, 255, 0.8);
  }
  .btn-up { grid-column: 2; grid-row: 1; }
  .btn-left { grid-column: 1; grid-row: 2; }
  .btn-right { grid-column: 3; grid-row: 2; }
  .btn-down { grid-column: 2; grid-row: 3; }
  .btn-a { grid-column: 2; grid-row: 2; }
  .btn-b { grid-column: 1; grid-row: 2; }
  .btn-z { grid-column: 1; grid-row: 1; }
  .btn-s { grid-column: 2; grid-row: 1; }
</style>

<div class="mobile-controls">
  <div class="dpad">
    <div class="touch-btn btn-up" id="btn-up">▲</div>
    <div class="touch-btn btn-left" id="btn-left">◄</div>
    <div class="touch-btn btn-right" id="btn-right">►</div>
    <div class="touch-btn btn-down" id="btn-down">▼</div>
  </div>
  <div class="action-btns">
    <div class="touch-btn btn-z" id="btn-z">Z</div>
    <div class="touch-btn btn-s" id="btn-s">ST</div>
    <div class="touch-btn btn-b" id="btn-b">B</div>
    <div class="touch-btn btn-a" id="btn-a">A</div>
  </div>
</div>

<script>
  (function() {
    function bindKey(elementId, keyCode) {
      const btn = document.getElementById(elementId);
      if (!btn) return;

      const press = (e) => {
        e.preventDefault();
        window.dispatchEvent(new KeyboardEvent('keydown', { keyCode: keyCode, bubbles: true }));
      };
      const release = (e) => {
        e.preventDefault();
        window.dispatchEvent(new KeyboardEvent('keyup', { keyCode: keyCode, bubbles: true }));
      };

      btn.addEventListener('touchstart', press, { passive: false });
      btn.addEventListener('touchend', release, { passive: false });
    }

    // Standard-Tastenbelegungen (KeyCodes)
    bindKey('btn-up', 38);    // Pfeil oben
    bindKey('btn-down', 40);  // Pfeil unten
    bindKey('btn-left', 37);  // Pfeil links
    bindKey('btn-right', 39); // Pfeil rechts
    bindKey('btn-a', 88);     // X-Taste (Springen)
    bindKey('btn-b', 67);     // C-Taste (Schlagen)
    bindKey('btn-z', 90);     // Z-Taste (Ducken)
    bindKey('btn-s', 13);     // Enter (Start)
  })();
</script>

</html>
